<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca SBPE - Acervo e Etiquetas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      body * { visibility: hidden; }
      #areaImpressao, #areaImpressao * { visibility: visible; }
      #areaImpressao {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 8mm !important;
        padding: 5mm !important;
      }
      .no-print { display: none !important; }
    }

    /* Efeito Ripple (Água) ao clicar */
    .ripple {
      position: relative;
      overflow: hidden;
    }
    .ripple::after {
      content: "";
      display: block;
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.4) 10%, transparent 10.01%);
      background-repeat: no-repeat;
      background-position: 50%;
      transform: scale(10, 10);
      opacity: 0;
      transition: transform .5s, opacity 1s;
    }
    .ripple:active::after {
      transform: scale(0, 0);
      opacity: .3;
      transition: 0s;
    }

    .etiqueta-card {
      width: 6.8cm;
      height: 3.8cm;
      border: 1.5px dashed #475569;
      padding: 6px 8px;
      box-sizing: border-box;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      page-break-inside: avoid;
    }

    .etiqueta-notacao {
      font-family: monospace;
      font-weight: 900;
      font-size: 13px;
      color: #0f172a;
      letter-spacing: -0.2px;
    }

    .tag-cor-lombada {
      font-size: 9px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      color: #000000 !important;
      border: 1px solid rgba(0, 0, 0, 0.3);
      display: inline-block;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .cor-VERDE { background-color: #86efac !important; }
    .cor-AZUL { background-color: #93c5fd !important; }
    .cor-AMARELO { background-color: #fef08a !important; }
    .cor-VERMELHO { background-color: #fca5a5 !important; }
    .cor-ROXO { background-color: #d8b4fe !important; }
    .cor-PRETO, .cor-CINZA { background-color: #cbd5e1 !important; }
    .cor-PADRAO { background-color: #e2e8f0 !important; }

    .etiqueta-titulo {
      font-weight: 800;
      font-size: 11px;
      line-height: 1.25;
      color: #0f172a;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .etiqueta-autor {
      font-size: 10px;
      color: #334155;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .etiqueta-rodape {
      font-size: 10px;
      font-weight: 800;
      color: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

  <nav class="bg-emerald-800 text-white p-4 shadow-md no-print">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-book-bookmark text-2xl text-emerald-300"></i>
        <div>
          <h1 class="font-bold text-lg leading-none">Biblioteca SBPE</h1>
          <p class="text-xs text-emerald-200 mt-0.5">Acervo Caixa Estante (Sistema SBPE / BPM-PE)</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="abrirModalEtiquetas()" class="ripple bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-3.5 py-2 rounded-lg transition shadow flex items-center gap-1.5">
          <i class="fa-solid fa-print"></i>
          <span>Imprimir Etiquetas</span>
        </button>
        <span id="contadorObras" class="bg-emerald-950/60 text-emerald-200 text-xs font-bold px-3 py-1.5 rounded-lg border border-emerald-700/50">0 obras</span>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-4 space-y-4 no-print">
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 space-y-2">
      <div class="flex gap-2">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
          <input type="text" id="inputPesquisa" onkeydown="if(event.key==='Enter') executarPesquisaManualmente()" placeholder="Pesquise por Título, Autor, Assunto (Gênero), Notação ou Cor de Lombada..." class="w-full pl-9 pr-4 py-2 text-xs rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-600">
        </div>
        <button onclick="executarPesquisaManualmente()" class="ripple bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2 rounded-lg text-xs font-bold transition shadow flex items-center gap-1.5">
          <i class="fa-solid fa-search"></i>
          <span>Pesquisar</span>
        </button>
      </div>
      
      <div id="bannerSugestao" class="hidden text-xs bg-amber-50 text-amber-800 p-2 rounded-lg border border-amber-200 flex items-center gap-2">
        <i class="fa-solid fa-lightbulb text-amber-500"></i>
        <span>Você quis dizer: <strong id="termoSugestao" class="underline cursor-pointer hover:text-amber-900" onclick="aplicarSugestao()"></strong>?</span>
      </div>
    </div>

    <div id="gridObras" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
      <p class="col-span-full text-center text-slate-400 py-10 text-xs">Carregando acervo SBPE...</p>
    </div>
  </main>

  <!-- MODAL FICHA DA OBRA -->
  <div id="modalFicha" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 no-print">
    <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl border border-slate-100 transform transition-all">
      <div class="bg-emerald-800 text-white p-4 flex justify-between items-center">
        <h3 class="font-bold text-sm flex items-center gap-2">
          <i class="fa-solid fa-book-open"></i>
          <span>Ficha da Obra</span>
        </h3>
        <button onclick="fecharFicha()" class="text-emerald-200 hover:text-white font-bold text-lg">✕</button>
      </div>

      <div class="p-5 space-y-4 max-h-[80vh] overflow-y-auto">
        <div class="flex flex-col sm:flex-row gap-4 items-center sm:items-start">
          <div class="w-36 h-48 bg-slate-200/60 rounded-lg overflow-hidden shadow-md flex-shrink-0 relative flex items-center justify-center p-1 group">
            <img id="fichaCapa" src="" class="max-h-full max-w-full object-contain group-hover:scale-105 transition-transform duration-300">
            <span id="fichaCor" class="absolute top-2 right-2 tag-cor-lombada"></span>
          </div>
          <div class="space-y-2 text-center sm:text-left flex-1">
            <span id="fichaNotacao" class="inline-block bg-slate-100 text-slate-800 font-mono text-xs font-bold px-2.5 py-1 rounded border border-slate-200"></span>
            <h2 id="fichaTitulo" class="font-bold text-slate-900 text-base leading-tight"></h2>
            <p id="fichaAutor" class="text-xs text-slate-600 font-medium"></p>
            <div class="flex gap-2 text-[11px] text-slate-500 font-semibold pt-1">
              <span id="fichaExemplar"></span>
              <span id="fichaVolume"></span>
            </div>
          </div>
        </div>

        <hr class="border-slate-200">

        <div class="space-y-2">
          <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
            <i class="fa-solid fa-tags text-emerald-600"></i>
            <span>Assuntos (Temas Correlacionados):</span>
          </h4>
          <div id="fichaAssuntos" class="flex flex-wrap gap-1.5"></div>
        </div>
      </div>

      <div class="bg-slate-50 p-3 border-t border-slate-100 text-right">
        <button onclick="fecharFicha()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-xs font-bold hover:bg-slate-300 transition">Fechar</button>
      </div>
    </div>
  </div>

  <!-- MODAL IMPRESSÃO -->
  <div id="modalEtiquetas" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 no-print">
    <div class="bg-white rounded-2xl max-w-xl w-full p-5 shadow-2xl space-y-4 border border-slate-100">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
          <i class="fa-solid fa-tags text-emerald-700"></i>
          <span>Imprimir Etiquetas de Lombada - SBPE</span>
        </h3>
        <button onclick="fecharModalEtiquetas()" class="text-slate-400 hover:text-slate-700 text-lg font-bold">✕</button>
      </div>

      <div class="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Data Inicial:</label>
          <input type="date" id="dataInicio" onchange="gerarPreviewEtiquetas()" class="w-full p-2 rounded-lg border border-slate-300">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">Data Final:</label>
          <input type="date" id="dataFim" onchange="gerarPreviewEtiquetas()" class="w-full p-2 rounded-lg border border-slate-300">
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="fecharModalEtiquetas()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-xs font-bold">Cancelar</button>
        <button onclick="window.print()" class="ripple px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-xs font-bold shadow flex items-center gap-1.5">
          <i class="fa-solid fa-print"></i>
          <span>Imprimir Agora</span>
        </button>
      </div>
    </div>
  </div>

  <div id="areaImpressao" class="hidden"></div>

  <script>
    const SPREADSHEET_ID = '1qp9NMs2qTPEjd9ks5TjG3Gq27A6zWnqfhVZM0kJB6gw';
    let todosOsLivros = [];
    let palavraSugestaoAtual = '';

    window.onload = function() { carregarDadosPlanilha(); };

    async function carregarDadosPlanilha() {
      const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&_ts=${Date.now()}`;

      try {
        const response = await fetch(url);
        const text = await response.text();
        const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const json = JSON.parse(jsonString);

        if (!json.table || !json.table.rows) {
          document.getElementById('gridObras').innerHTML = `<p class="col-span-full text-center text-slate-400 py-10 text-xs">Nenhuma obra cadastrada.</p>`;
          return;
        }

        todosOsLivros = json.table.rows.map((row, index) => {
          const c = row.c || [];
          return {
            id: index,
            notacao: getCellVal(c, 0),
            exemplar: getCellVal(c, 1),
            volume: getCellVal(c, 2),
            titulo: getCellVal(c, 3),
            autor: getCellVal(c, 4),
            assunto: getCellVal(c, 5),
            corLombada: getCellVal(c, 6).toUpperCase() || 'VERDE',
            capa: getCellVal(c, 7),
            dataRegistro: getCellVal(c, 8)
          };
        }).filter(l => l.titulo !== '' || l.notacao !== '');

        document.getElementById('contadorObras').innerText = `${todosOsLivros.length} obras`;
        renderizarGrid(todosOsLivros);
        gerarPreviewEtiquetas();
      } catch (err) {
        console.error("Erro ao carregar:", err);
        document.getElementById('gridObras').innerHTML = `<p class="col-span-full text-center text-red-500 font-bold py-10 text-xs">Erro de conexão com a planilha.</p>`;
      }
    }

    function getCellVal(cells, index) {
      if (!cells || !cells[index]) return '';
      const val = cells[index].f !== undefined && cells[index].f !== null ? cells[index].f : cells[index].v;
      if (val === null || val === undefined) return '';
      return String(val).trim();
    }

    function renderizarGrid(livros) {
      const grid = document.getElementById('gridObras');
      if (livros.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-10 text-xs">Nenhuma obra encontrada.</p>`;
        return;
      }

      grid.innerHTML = livros.map(livro => `
        <div onclick="abrirFicha(${livro.id})" class="ripple group bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between hover:shadow-xl hover:-translate-y-1 transition-all duration-300 cursor-pointer">
          <div class="h-48 bg-slate-200/60 overflow-hidden relative flex items-center justify-center p-1.5">
            <img src="${livro.capa || 'https://via.placeholder.com/150x200?text=Sem+Capa'}" class="max-h-full max-w-full object-contain group-hover:scale-105 transition-transform duration-500 ease-out drop-shadow">
            <span class="absolute top-2 right-2 tag-cor-lombada cor-${obterClasseCor(livro.corLombada)}">${livro.corLombada}</span>
          </div>
          <div class="p-3 space-y-1 bg-white">
            <span class="inline-block bg-slate-100 text-slate-800 text-[10px] font-mono font-bold px-2 py-0.5 rounded border border-slate-200">${livro.notacao}</span>
            <h4 class="font-bold text-xs text-slate-900 truncate group-hover:text-emerald-700 transition-colors">${livro.titulo}</h4>
            <p class="text-[10px] text-slate-500 truncate">${livro.autor}</p>
          </div>
        </div>
      `).join('');
    }

    function abrirFicha(id) {
      const livro = todosOsLivros.find(l => l.id === id);
      if (!livro) return;

      document.getElementById('fichaCapa').src = livro.capa || 'https://via.placeholder.com/150x200?text=Sem+Capa';
      document.getElementById('fichaTitulo').innerText = livro.titulo;
      document.getElementById('fichaAutor').innerText = livro.autor || 'Autor não informado';
      document.getElementById('fichaNotacao').innerText = livro.notacao || 'S/N';
      document.getElementById('fichaExemplar').innerText = livro.exemplar ? `Exemplar: ${livro.exemplar}` : '';
      document.getElementById('fichaVolume').innerText = livro.volume ? `Volume: ${livro.volume}` : '';
      
      const badgeCor = document.getElementById('fichaCor');
      badgeCor.innerText = livro.corLombada;
      badgeCor.className = `absolute top-2 right-2 tag-cor-lombada cor-${obterClasseCor(livro.corLombada)}`;

      const divAssuntos = document.getElementById('fichaAssuntos');
      if (livro.assunto) {
        const assuntos = livro.assunto.split(/[,;-]/).map(a => a.trim()).filter(a => a !== '');
        divAssuntos.innerHTML = assuntos.map(a => `
          <span onclick="pesquisarPorAssunto('${a}')" class="ripple bg-emerald-50 text-emerald-800 text-[11px] font-bold px-2.5 py-1 rounded-lg border border-emerald-200 hover:bg-emerald-200 cursor-pointer transition">
            # ${a}
          </span>
        `).join('');
      } else {
        divAssuntos.innerHTML = `<span class="text-slate-400 text-xs italic">Nenhum assunto especificado.</span>`;
      }

      document.getElementById('modalFicha').classList.remove('hidden');
    }

    function fecharFicha() {
      document.getElementById('modalFicha').classList.add('hidden');
    }

    function pesquisarPorAssunto(assunto) {
      fecharFicha();
      document.getElementById('inputPesquisa').value = assunto;
      executarPesquisaManualmente();
    }

    function executarPesquisaManualmente() {
      filtrarObras();
    }

    function filtrarObras() {
      const termo = document.getElementById('inputPesquisa').value.toLowerCase().trim();
      const banner = document.getElementById('bannerSugestao');

      if (!termo) {
        banner.classList.add('hidden');
        renderizarGrid(todosOsLivros);
        return;
      }

      const filtrados = todosOsLivros.filter(l => 
        l.titulo.toLowerCase().includes(termo) ||
        l.autor.toLowerCase().includes(termo) ||
        l.notacao.toLowerCase().includes(termo) ||
        l.corLombada.toLowerCase().includes(termo) ||
        l.assunto.toLowerCase().includes(termo)
      );

      if (filtrados.length === 0 && termo.length >= 3) {
        const sugestao = buscarSugestaoAproximada(termo);
        if (sugestao) {
          palavraSugestaoAtual = sugestao;
          document.getElementById('termoSugestao').innerText = sugestao;
          banner.classList.remove('hidden');
        } else {
          banner.classList.add('hidden');
        }
      } else {
        banner.classList.add('hidden');
      }

      renderizarGrid(filtrados);
    }

    function aplicarSugestao() {
      if (palavraSugestaoAtual) {
        document.getElementById('inputPesquisa').value = palavraSugestaoAtual;
        filtrarObras();
      }
    }

    function buscarSugestaoAproximada(termo) {
      let vocabulario = new Set();
      todosOsLivros.forEach(l => {
        l.titulo.split(' ').forEach(w => vocabulario.add(w.toLowerCase()));
        l.autor.split(' ').forEach(w => vocabulario.add(w.toLowerCase()));
        l.assunto.split(/[,;\s]+/).forEach(w => vocabulario.add(w.toLowerCase()));
      });

      let melhorPalavra = '';
      let menorDistancia = 999;

      vocabulario.forEach(palavra => {
        if (palavra.length >= 3) {
          const dist = calcularLevenshtein(termo, palavra);
          if (dist < menorDistancia && dist <= 2) {
            menorDistancia = dist;
            melhorPalavra = palavra;
          }
        }
      });

      return melhorPalavra;
    }

    function calcularLevenshtein(a, b) {
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    function normalizarDataParaISO(dataStr) {
      if (!dataStr) return '';
      let s = String(dataStr).trim();

      if (s.includes('Date(')) {
        const m = s.match(/\d+/g);
        if (m && m.length >= 3) {
          const ano = m[0];
          const mes = String(parseInt(m[1], 10) + 1).padStart(2, '0');
          const dia = String(m[2]).padStart(2, '0');
          return `${ano}-${mes}-${dia}`;
        }
      }

      s = s.split(' ')[0].split('T')[0];

      if (s.includes('/')) {
        const partes = s.split('/');
        if (partes.length === 3) {
          const dia = partes[0].padStart(2, '0');
          const mes = partes[1].padStart(2, '0');
          const ano = partes[2];
          return `${ano}-${mes}-${dia}`;
        }
      }

      if (s.includes('-')) {
        const partes = s.split('-');
        if (partes.length === 3 && partes[0].length === 4) {
          return s;
        }
      }

      return '';
    }

    function gerarPreviewEtiquetas() {
      const area = document.getElementById('areaImpressao');
      const dInicio = document.getElementById('dataInicio').value;
      const dFim = document.getElementById('dataFim').value;

      const filtrados = todosOsLivros.filter(l => {
        if (!dInicio && !dFim) return true;
        const dataISO = normalizarDataParaISO(l.dataRegistro);
        if (!dataISO) return true;
        if (dInicio && dataISO < dInicio) return false;
        if (dFim && dataISO > dFim) return false;
        return true;
      });

      area.innerHTML = filtrados.map(livro => {
        let textEx = '';
        if (livro.exemplar) {
          const ex = livro.exemplar.trim();
          const exLower = ex.toLowerCase();
          if (ex !== '' && !exLower.includes('1º') && exLower !== 'ex. 1' && exLower !== '1') {
            textEx = ex;
          }
        }

        let textVol = '';
        if (livro.volume) {
          const v = livro.volume.trim();
          const vLower = v.toLowerCase();
          if (v !== '' && vLower !== 'único' && vLower !== 'unico' && vLower !== '1' && vLower !== 'vol. 1' && vLower !== 'v. 1') {
            textVol = `Vol. ${v}`;
          }
        }

        const classeCor = obterClasseCor(livro.corLombada);

        return `
          <div class="etiqueta-card">
            <div class="flex justify-between items-center">
              <span class="etiqueta-notacao">${livro.notacao}</span>
              <span class="tag-cor-lombada cor-${classeCor}">${livro.corLombada || 'VERDE'}</span>
            </div>
            <hr class="border-t border-slate-300 my-1">
            <div class="flex-1 flex flex-col justify-center">
              <div class="etiqueta-titulo">${livro.titulo}</div>
              <div class="etiqueta-autor">${livro.autor}</div>
            </div>
            <hr class="border-t border-slate-300 my-1">
            <div class="etiqueta-rodape">
              <span>${textEx}</span>
              <span>${textVol}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function obterClasseCor(cor) {
      if (!cor) return 'PADRAO';
      const c = cor.toUpperCase();
      if (c.includes('VERDE')) return 'VERDE';
      if (c.includes('AZUL')) return 'AZUL';
      if (c.includes('AMARELO')) return 'AMARELO';
      if (c.includes('VERMELHO')) return 'VERMELHO';
      if (c.includes('ROXO')) return 'ROXO';
      if (c.includes('PRETO') || c.includes('CINZA')) return 'CINZA';
      return 'PADRAO';
    }

    function abrirModalEtiquetas() { document.getElementById('modalEtiquetas').classList.remove('hidden'); }
    function fecharModalEtiquetas() { document.getElementById('modalEtiquetas').classList.add('hidden'); }
  </script>
</body>
